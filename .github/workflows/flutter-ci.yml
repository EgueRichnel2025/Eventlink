name: EventLink Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  flutter:
    name: Analyze, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Firebase configuration
        run: |
          echo "Repository files:"
          ls -la
          echo "lib directory:"
          ls -la lib
          echo "Firebase options:"
          test -f lib/firebase_options.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://eventlink-api-uu8u.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eventlink-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

