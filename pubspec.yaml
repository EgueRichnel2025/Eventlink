name: eventlink
description: "EventLink — centraliser les opportunités partagées en groupe."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Gestion d'état
  provider: ^6.1.2

  # Réseau
  http: ^1.2.2

  # Stockage sécurisé du token de session
  flutter_secure_storage: ^9.2.2

  # Sélection d'image (photo de profil, image d'événement)
  image_picker: ^1.1.2

  # Ouverture de liens externes (lien d'un événement)
  url_launcher: ^6.3.1

  # Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Calendrier
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
